
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luisa's Website ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #fbe0ed, #e5dafa);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #75468e;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #84658e;
            font-size: 18px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 35px;
            border-radius: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(130, 83, 151, 0.12);
        }

        .card h2 {
            color: #88599a;
        }

        .card p {
            color: #816b8d;
            line-height: 1.7;
        }

        button {
            background: #b78acb;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px 25px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #9565b0;
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #9574a1;
        }
    </style>
</head>

<body>
    <div class="container">
        <p>✨ MY LITTLE CORNER OF THE INTERNET ✨</p>

        <h1>Luisa's Website ♡</h1>

        <p class="subtitle">
            Welcome to Luisa's Microsite!
        </p>

        <div class="card">
            <h2>Hello, welcome! 🌸</h2>

            <p>
                So happy you're here!
                This is my little space on the internet.
            </p>

            <button onclick="alert('Thanks for visiting! 💗')">
                Explore My Website ♡
            </button>
        </div>

        <footer>Made with ♡ by Luisa</footer>
    </div>
</body>
</html>
