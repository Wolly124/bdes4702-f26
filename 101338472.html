<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chris Kim — designer, developer, and creative thinker." />
    <title>Chris Kim</title>
    <style>
      :root {
        --ink: #171717;
        --paper: #f5f2ea;
        --lime: #c8ff4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        background: var(--paper);
        font-family: Arial, Helvetica, sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        width: 34rem;
        height: 34rem;
        right: -14rem;
        bottom: -12rem;
        border-radius: 50%;
        background: var(--lime);
        filter: blur(1px);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(880px, calc(100% - 48px));
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 24px;
        padding: 8px 12px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 800px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(72px, 12vw, 150px);
        font-weight: 400;
        line-height: 0.82;
        letter-spacing: -0.07em;
      }

      h1 em {
        display: block;
        margin-left: 0.55em;
        color: transparent;
        -webkit-text-stroke: 2px var(--ink);
        font-weight: 400;
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 42px;
        border-top: 1px solid var(--ink);
        padding-top: 18px;
      }

      footer p {
        max-width: 380px;
        margin: 0;
        font-size: clamp(16px, 2vw, 20px);
        line-height: 1.4;
      }

      .status {
        white-space: nowrap;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;
        border-radius: 50%;
        background: #58b91d;
        box-shadow: 0 0 0 4px rgba(88, 185, 29, 0.14);
      }

      @media (max-width: 600px) {
        main {
          width: calc(100% - 32px);
        }

        h1 {
          font-size: clamp(64px, 22vw, 100px);
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 20px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <p class="eyebrow">Independent creative · Seoul / Everywhere</p>

      <h1>
        Chris
        <em>Kim</em>
      </h1>

      <footer>
        <p>I turn ambitious ideas into thoughtful digital experiences, useful products, and memorable brands.</p>
        <p class="status">Available for select projects</p>
      </footer>
    </main>
  </body>
</html>
